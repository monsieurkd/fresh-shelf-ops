name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: |
          uv python install 3.12
          uv sync --all-groups --frozen

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      # The world is built BEFORE the tests, deliberately. Five report tests
      # need a warehouse and would otherwise skip silently, and a green run with
      # skipped tests is worse than a red one: it reads as coverage that is not
      # there. Building first also means the test step exercises the same
      # artifacts the rest of the job does.
      - name: Simulate a small world
        run: make world-small

      - name: Load raw layer
        run: make ingest

      - name: dbt seed + build
        run: make build

      - name: Forecast + optimise
        run: |
          make forecast
          make optimise

      - name: Full suite on the built warehouse
        run: .venv/bin/pytest --tb=short

      # `--strict-markers` plus an explicit no-skips assertion: the fast tier is
      # pure logic and must never skip.
      - name: Fast tier must pass with nothing skipped
        run: |
          .venv/bin/pytest -m "not slow" -q --no-header -rs \
            | tee /tmp/fast.log
          ! grep -q "skipped" /tmp/fast.log

      - name: Render report
        run: make report

      - name: Idempotency — land, load and build again, expect identical raw counts
        run: make idempotency

      - name: Upload warehouse + report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-shelf-artifacts
          path: |
            data/artifacts/**
            build/report/**
            target/manifest.json
          retention-days: 7
